version: "3.8"

services:
  nginx:
    image: nginx
    volumes:
      - ./configs/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dev-certs:/etc/nginx/certs
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
      - oauth2-proxy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    configs:
      - source: oa2p-config
        target: /etc/oauth2-proxy.cfg
    restart: unless-stopped
    env_file: "oauth2-proxy.env"
    entrypoint: /bin/oauth2-proxy --config /etc/oauth2-proxy.cfg
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.3
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_LOG: console
      KC_LOG_LEVEL: info
    command:
      - start-dev
      - --db
      - postgres
      - --db-url-host
      - postgres-keycloak
      - --db-username
      - ${POSTGRES_KEYCLOAK_USER}
      - --db-password
      - ${POSTGRES_KEYCLOAK_PASSWORD}
      - --health-enabled
      - "true"
      - --proxy
      - edge
      - --hostname-strict=false
    ports:
      - "8081:8080"
    depends_on:
      - postgres-keycloak

  postgres-keycloak:
    image: postgres:9.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      POSTGRES_DB: keycloak

configs:
  oa2p-config:
    file: ./configs/oauth2-proxy/oauth2-proxy.cfg
