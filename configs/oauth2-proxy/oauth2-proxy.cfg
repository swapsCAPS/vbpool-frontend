email_domains = "*"

provider = "keycloak-oidc"
oidc_issuer_url = "http://host.docker.internal:8081/realms/dev"

http_address = ":4180"
https_address = ":443"
reverse_proxy = true
redirect_url = "https://app.local-vbpool.nl/oauth2/callback"
code_challenge_method = "S256"
whitelist_domains = ".local-vbpool.nl:"

cookie_name = "_oauth2_proxy"
cookie_domains = ""
cookie_expire = "168h"
cookie_refresh = "1h"
cookie_secure = true
cookie_httponly = true

upstreams = [
  "http://host.docker.internal:8001/"
]
